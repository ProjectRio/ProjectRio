name: Builds

on:
  push:
    branches:
      - "**_release"
      - "master"
  pull_request:
    branches: 
      - "**_release"
      - "master"
    paths-ignore:
      - "**.md"
      - "**.ini"

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release ]
        include:
          - build_type: Release
            artifact_name: ProjectRio-Windows
            build_config: -G "Ninja" -DCMAKE_SYSTEM_VERSION="10.0.22621" -DCMAKE_BUILD_TYPE="Release" -DQt5_DIR:STRING="D:\a\dolphin\dolphin\Externals\Qt\Qt5.3.0\x64\lib\cmake\Qt5\"
    env:
      DXSDK_DIR: "C:\\Program Files (x86)\\Microsoft DirectX SDK (June 2010)\\"
    name: "Windows ${{ matrix.build_type }}"
    runs-on: windows-2022
    steps:
      - name: "Checkout"
        uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: 'Fetch Git Tags'
        shell: bash
        if: success()
        run: |
          git fetch --prune --unshallow
          echo "GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV
          echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "GIT_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
          echo "CURR_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
      - uses: seanmiddleditch/gha-setup-ninja@master
      - uses: egor-tensin/vs-shell@v2
      - name: "Build ${{ matrix.build_type }} Dolphin"
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          SET PATH=%PATH%;C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64;C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x86;C:\Program Files\7-Zip;C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin;C:\Python27\;C:\Python27\Scripts;C:\Windows\system32;C:\Windows;C:\Windows\System32\Wbem;C:\Windows\System32\WindowsPowerShell\v1.0\;C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin;C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja;C:\Program Files\Microsoft VS Code\bin;C:\Program Files\Git\cmd
          cd ./Source
          msbuild.exe /v:m /p:Platform=x64 /p:Configuration=Release dolphin-emu.sln
      - name: "Package ${{ matrix.build_type }}"
        working-directory: ${{ github.workspace }}
        run: |
          Xcopy /Y /E /I .\Data\Sys .\Binary\x64\Sys
          cd .\Binary\x64\
          fsutil file createnew FIX-VCRUNTIME140-ERROR.txt 0
          echo "Download and install this: https://aka.ms/vs/16/release/vc_redist.x64.exe" > .\FIX-VCRUNTIME140-ERROR.txt
      - name: "Build Installer"
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          makensis /DDOLPHIN_ARCH=x64 /DPRODUCT_VERSION="${{ env.CURR_DATE }}-${{ env.GIT_HASH }}-${{ env.GIT_TAG }}" Installer\Installer.nsi
      - name: "Package Artifact"
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          FILE_NAME="${{ env.CURR_DATE }}-${{ env.GIT_HASH }}-${{ env.GIT_TAG }}-${{ matrix.artifact_name }}.exe"
          mkdir artifact
          mv "Installer/projectrio-x64-${{ env.CURR_DATE }}-${{ env.GIT_HASH }}-${{ env.GIT_TAG }}-installer.exe" "artifact/$FILE_NAME"
      - name: "Publish"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: "./artifact/"
  linux:
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release ]
        include:
          - build_type: Release
            artifact_name: linux
            build_config: release
    name: "Linux ${{ matrix.build_type }}"
    runs-on: ubuntu-22.04
    steps:
      - name: "Checkout"
        uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: 'Fetch Git Tags'
        if: success()
        run: |
          git fetch --prune --unshallow
          echo "GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV
          echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "GIT_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
          echo "CURR_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
      - name: "Install prerequisites"
        if: success()
        shell: bash
        run: |
          sudo dpkg --add-architecture amd64
          sudo apt update
          sudo apt install -y software-properties-common 
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo add-apt-repository ppa:daschuer/qt6-backports
          sudo apt install -y gcc-11 g++-11
          sudo apt-get install fuse libfuse2
          sudo apt update
          sudo apt install \
          cmake \
          ca-certificates \
          qt6-base-dev \
          qt6-base-private-dev \
          libqt6svg6-dev \
          make \
          pkg-config \
          udev \
          libudev1 \
          libavcodec-dev \
          libavformat-dev \
          libavutil-dev \
          libswscale-dev \
          libxi-dev \
          libxrandr-dev \
          libevdev-dev \
          libsfml-dev \
          libminiupnpc-dev \
          libmbedtls-dev \
          libcurl4-openssl-dev \
          libhidapi-dev \
          libbluetooth-dev \
          libasound2-dev \
          libpulse-dev \
          libpugixml-dev \
          libbz2-dev \
          libzstd-dev \
          liblzo2-dev \
          libpng-dev \
          libusb-1.0-0-dev \
          gettext libudev-dev \
          libsystemd-dev \
          -y
      - name: "Build ${{ matrix.build_type }} Project Rio"
        if: success()
        working-directory: ${{ github.workspace }}
        run: |
          git config core.fileMode false ; chmod +x ./build-linux.sh && ./build-linux.sh ${{ matrix.build_config }}
  macOS:
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release ]
        arch: [ arm64, x86_64 ]
        include:
          - arch: arm64
            artifact_name: ProjectRio-macOS-arm64
          - arch: x86_64
            artifact_name: ProjectRio-macOS-x86_64
          - build_type: Release
            build_config: release
    name: "macOS ${{ matrix.build_type }} ${{ matrix.arch }}"
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: "Checkout"
        uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: 'Fetch Git Tags'
        if: success()
        run: |
          git fetch --prune --unshallow
          echo "GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV
          echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "GIT_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
          echo "CURR_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
      - name: "Set up Python"
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: "Cache Homebrew downloads"
        uses: actions/cache@v3
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-${{ matrix.arch }}-brew-${{ hashFiles('.github/workflows/main.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-brew-
      - name: "Cache x86_64 Homebrew prefix"
        if: matrix.arch == 'x86_64'
        uses: actions/cache@v3
        with:
          path: |
            /usr/local/Homebrew
            /usr/local/Cellar
            /usr/local/opt
            /usr/local/bin
            /usr/local/lib
            /usr/local/include
            /usr/local/share
          key: ${{ runner.os }}-brew-x86_64-prefix-${{ hashFiles('.github/workflows/main.yml') }}
          restore-keys: |
            ${{ runner.os }}-brew-x86_64-prefix-
      - name: "Cache ccache"
        uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-${{ matrix.arch }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-ccache-
      - name: "Install prerequisites (arm64)"
        if: success() && matrix.arch == 'arm64'
        shell: bash
        run: |
          rm '/usr/local/bin/2to3' || true
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> $GITHUB_ENV
          brew upgrade cmake
          brew install \
          ccache \
          ffmpeg \
          libpng \
          pkgconfig \
          libao \
          sound-touch \
          hidapi \
          icu4c \
          qt@6
          brew unlink fmt || true
      - name: "Install prerequisites (x86_64 via Rosetta)"
        if: success() && matrix.arch == 'x86_64'
        shell: bash
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> $GITHUB_ENV
          if [ ! -x /usr/local/bin/brew ]; then
            echo "Installing x86_64 Homebrew under Rosetta..."
            arch -x86_64 /bin/bash -c \
              "NONINTERACTIVE=1 /bin/bash -c \"\$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)\""
          fi
          echo "/usr/local/bin" >> $GITHUB_PATH
          arch -x86_64 /usr/local/bin/brew update-reset || true
          arch -x86_64 /usr/local/bin/brew install \
            cmake \
            ccache \
            ffmpeg \
            libpng \
            pkgconfig \
            libao \
            sound-touch \
            hidapi \
            icu4c \
            qt@6
          arch -x86_64 /usr/local/bin/brew unlink fmt || true
      - name: "Build ${{ matrix.build_type }} Project Rio (arm64)"
        if: success() && matrix.arch == 'arm64'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          git config core.fileMode false ; chmod +x ./build-mac.sh && ./build-mac.sh ${{ matrix.build_config }}
      - name: "Build ${{ matrix.build_type }} Project Rio (x86_64 via Rosetta)"
        if: success() && matrix.arch == 'x86_64'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          BUILD_ARCH: x86_64
        run: |
          git config core.fileMode false
          chmod +x ./build-mac.sh
          arch -x86_64 /bin/bash ./build-mac.sh ${{ matrix.build_config }}
      - name: Package ${{ matrix.build_type }}
        if: success()
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          FILE_NAME=${{ env.CURR_DATE }}-${{ env.GIT_HASH }}-${{ env.GIT_TAG }}-${{ matrix.artifact_name }}.zip
          mkdir artifact
          cd ./build/Binaries/
          zip -r "${FILE_NAME}" "ProjectRio.app"
          mv "${FILE_NAME}" ../../artifact/
      - name: "Publish"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: "./artifact/"

  steamOS:
    name: "Steam Deck (Flatpak)"
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:kde-6.7
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release ]
        include:
          - build_type: Release
            artifact_name: ProjectRio-steamOS
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@bf5cafdfd97dcf5a89c7475bbc86a616e1f86acb # v6.7
        with:
          manifest-path: Tools/flatpak.yml
          bundle: ${{ matrix.artifact_name }}.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
