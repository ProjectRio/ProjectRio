name: Builds

on:
  push:
    branches:
      - "**_release"
      - "master"
    # A version tag also runs the release job at the bottom of this file.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: 
      - "**_release"
      - "master"
    paths-ignore:
      - "**.md"
      - "**.ini"

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release ]
        include:
          - build_type: Release
            artifact_name: ProjectRio-Windows
            build_config: -G "Ninja" -DCMAKE_SYSTEM_VERSION="10.0.22621" -DCMAKE_BUILD_TYPE="Release" -DQt5_DIR:STRING="D:\a\dolphin\dolphin\Externals\Qt\Qt5.3.0\x64\lib\cmake\Qt5\"
    env:
      DXSDK_DIR: "C:\\Program Files (x86)\\Microsoft DirectX SDK (June 2010)\\"
    name: "Windows ${{ matrix.build_type }}"
    runs-on: windows-2022
    steps:
      - name: "Checkout"
        uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: 'Fetch Git Tags'
        shell: bash
        if: success()
        run: |
          git fetch --prune --unshallow
          echo "GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV
          echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "GIT_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
          echo "CURR_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
      - uses: seanmiddleditch/gha-setup-ninja@master
      - uses: egor-tensin/vs-shell@v2
      - name: "Build ${{ matrix.build_type }} Dolphin"
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          SET PATH=%PATH%;C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64;C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x86;C:\Program Files\7-Zip;C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin;C:\Python27\;C:\Python27\Scripts;C:\Windows\system32;C:\Windows;C:\Windows\System32\Wbem;C:\Windows\System32\WindowsPowerShell\v1.0\;C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin;C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja;C:\Program Files\Microsoft VS Code\bin;C:\Program Files\Git\cmd
          cd ./Source
          msbuild.exe /v:m /p:Platform=x64 /p:Configuration=Release dolphin-emu.sln
      - name: "Package ${{ matrix.build_type }}"
        working-directory: ${{ github.workspace }}
        run: |
          Xcopy /Y /E /I .\Data\Sys .\Binary\x64\Sys
          cd .\Binary\x64\
          fsutil file createnew FIX-VCRUNTIME140-ERROR.txt 0
          echo "Download and install this: https://aka.ms/vs/16/release/vc_redist.x64.exe" > .\FIX-VCRUNTIME140-ERROR.txt
          # List of every file this build ships, relative and '/' separated. The updater compares
          # it with the next version's files to delete what that version no longer ships. Must be
          # written last, and before the zip and the installer are made so both include it.
          $files = @(Get-ChildItem -Recurse -File -Name | ForEach-Object { $_.Replace('\', '/') }) + 'install_manifest.txt'
          [IO.File]::WriteAllLines("$PWD\install_manifest.txt", $files)
      - name: "Build Installer"
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          makensis /DDOLPHIN_ARCH=x64 /DPRODUCT_VERSION="${{ env.CURR_DATE }}-${{ env.GIT_HASH }}-${{ env.GIT_TAG }}" Installer\Installer.nsi
      - name: "Package Artifact"
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          FILE_NAME="${{ env.CURR_DATE }}-${{ env.GIT_HASH }}-${{ env.GIT_TAG }}-${{ matrix.artifact_name }}"
          mkdir artifact
          # Zip the portable build
          cd Binary/x64
          7z a "../../artifact/${FILE_NAME}.zip" .
          cd ../../
          # Move the installer
          mv "Installer/projectrio-x64-${{ env.CURR_DATE }}-${{ env.GIT_HASH }}-${{ env.GIT_TAG }}-installer.exe" "artifact/${FILE_NAME}.exe"
      - name: "Publish"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: "./artifact/"
  linux:
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release ]
        include:
          - build_type: Release
            artifact_name: ProjectRio-Linux
            build_config: release
    name: "Linux ${{ matrix.build_type }}"
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout"
        uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: 'Fetch Git Tags'
        if: success()
        run: |
          git fetch --prune --unshallow
          echo "GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV
          echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "GIT_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
          echo "CURR_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
      - name: "Install prerequisites"
        if: success()
        # Installed directly rather than through a package-caching action: with an empty cache that
        # action installed nothing and still reported success, which only showed up as a failed
        # build in a fresh repository.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            fuse \
            libfuse2 \
            cmake \
            ccache \
            ninja-build \
            ca-certificates \
            qt6-base-dev \
            qt6-base-private-dev \
            qt6-svg-dev \
            qt6-xdgdesktopportal-platformtheme \
            pkg-config \
            udev \
            libudev1 \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libxi-dev \
            libxrandr-dev \
            libevdev-dev \
            libsfml-dev \
            libminiupnpc-dev \
            libmbedtls-dev \
            libcurl4-openssl-dev \
            libhidapi-dev \
            libbluetooth-dev \
            libasound2-dev \
            libpulse-dev \
            libpugixml-dev \
            libbz2-dev \
            libzstd-dev \
            liblzo2-dev \
            libpng-dev \
            libusb-1.0-0-dev \
            libsdl2-dev \
            libfmt-dev \
            liblz4-dev \
            gettext \
            libenet-dev \
            liblzma-dev \
            libgtest-dev \
            libudev-dev \
            libsystemd-dev
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true
      - name: "Build ${{ matrix.build_type }} Project Rio"
        if: success()
        working-directory: ${{ github.workspace }}
        run: |
          git config core.fileMode false ; bash ./build-linux.sh ${{ matrix.build_config }}
      - name: Package ${{ matrix.build_type }}
        working-directory: ${{ github.workspace }}
        run: |
          git config core.fileMode false ; bash ./build-appimage.sh
      - name: "Publish"
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ./build/Binaries/${{ matrix.artifact_name }}.AppImage
          archive: false
  macOS:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            artifact_name: ProjectRio-macOS-arm64
          - arch: x86_64
            runner: macos-26-intel
            artifact_name: ProjectRio-macOS-x86_64
    name: "macOS ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: "Checkout"
        uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: "Fetch Git Tags"
        run: |
          git fetch --prune --unshallow
          echo "GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV
          echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "GIT_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
          echo "CURR_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
      - name: "Set up Python"
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: "Cache Homebrew downloads"
        uses: actions/cache@v3
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-${{ matrix.arch }}-brew-${{ hashFiles('.github/workflows/main.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-brew-
      - name: "Cache ccache"
        uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-${{ matrix.arch }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-ccache-
      - name: "Install prerequisites"
        shell: bash
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1

          # Pin qtbase to 6.11.0. qtbase 6.11.1 regressed macOS fullscreen handling:
          # the render window no longer snaps back to the forced 4:3 aspect ratio on a
          # fullscreen toggle until the window is manually nudged. Homebrew's `qt`
          # formula is just an umbrella of symlinks; QtGui (where the regression lives)
          # ships in the separate `qtbase` formula, so we pin qtbase, not qt. `qt`
          # depends on `qtbase` without a version constraint, so installing 6.11.0 first
          # satisfies the `qt@6` install below and it won't upgrade qtbase. Other Qt
          # modules (qtsvg, etc.) stay current — a 6.11.0 qtbase against 6.11.1 modules
          # builds and runs fine (validated locally). Drop this pin once a qtbase past
          # 6.11.1 restores the fullscreen behaviour.
          # homebrew-core commit for qtbase 6.11.0 (bottled): arm64_tahoe + sonoma cover
          # the macos-26 (arm64) and macos-26-intel (x86_64, via the sonoma fallback) runners.
          QTBASE_REF="56729e9a19c74be24ba16e2bef7dfa9ab6e07a76"
          PIN_TAP_DIR="$(brew --repository)/Library/Taps/local/homebrew-qtpin/Formula"
          mkdir -p "$PIN_TAP_DIR"
          curl -fsSL "https://raw.githubusercontent.com/Homebrew/homebrew-core/${QTBASE_REF}/Formula/q/qtbase.rb" \
            -o "$PIN_TAP_DIR/qtbase.rb"
          brew uninstall --ignore-dependencies qtbase 2>/dev/null || true
          brew install local/qtpin/qtbase
          brew pin qtbase

          brew install \
            ccache \
            ffmpeg \
            libpng \
            pkgconfig \
            libao \
            sound-touch \
            hidapi \
            icu4c \
            qt@6
          brew unlink fmt || true
      - name: "Build ${{ matrix.arch }}"
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          git config core.fileMode false
          ./build-mac.sh release
      - name: "Package"
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          FILE_NAME=${{ env.CURR_DATE }}-${{ env.GIT_HASH }}-${{ env.GIT_TAG }}-${{ matrix.artifact_name }}.zip
          mkdir artifact
          cd ./build/Binaries/
          # Both bundles have to be in here: the updater lives beside ProjectRio.app, and the
          # auto-updater unpacks this archive straight over the directory containing them.
          # -y keeps symlinks as symlinks, which the Qt framework layout depends on.
          zip -ry "${FILE_NAME}" "ProjectRio.app" "Project Rio Updater.app"
          mv "${FILE_NAME}" ../../artifact/
      - name: "Publish"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: "./artifact/"

  steamOS:
    name: "Steam Deck (Flatpak)"
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:kde-6.7
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release ]
        include:
          - build_type: Release
            artifact_name: ProjectRio-steamOS
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@bf5cafdfd97dcf5a89c7475bbc86a616e1f86acb # v6.7
        with:
          manifest-path: Tools/flatpak.yml
          bundle: ${{ matrix.artifact_name }}.flatpak
          cache-key: flatpak-builder-${{ github.sha }}

  # Runs only for a version tag (e.g. 2.3.0). Gathers every build above and puts them on a DRAFT
  # GitHub release under the names the auto-updater looks for (docs/autoupdate_overview.md,
  # "Release requirements"). Nothing reaches users until someone reviews the draft and publishes it.
  release:
    name: "Draft release"
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, macOS, steamOS]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "Check the tag matches the version in the code"
        # A build reports RIO_REV_STR as its version. If the tag is ahead of it, every updated
        # install still looks out of date and offers the same update on every launch.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE_VERSION=$(sed -n 's/^#define RIO_REV_STR "\(.*\)".*/\1/p' Source/Core/Common/Version.cpp | tr -d '\r')
          echo "tag: ${TAG}, RIO_REV_STR: ${CODE_VERSION}"
          if [ "${TAG}" != "${CODE_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match RIO_REV_STR \"${CODE_VERSION}\" in Source/Core/Common/Version.cpp"
            exit 1
          fi
      - name: "Download builds"
        uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: "Collect release assets"
        # The names matter: the updater picks its asset by them. Each one must be the file itself,
        # not an archive wrapped around it.
        run: |
          set -euo pipefail
          mkdir release
          one() {  # one <glob> <release name>: exactly one build file must match
            mapfile -t found < <(find artifacts -type f -name "$1" | sort)
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one file matching $1, found ${#found[@]}: ${found[*]:-}"
              exit 1
            fi
            cp "${found[0]}" "release/$2"
          }
          one '*ProjectRio-Windows.zip'       Project_Rio_Windows.zip
          one '*ProjectRio-Windows.exe'       Project_Rio_Windows_Installer.exe
          one '*ProjectRio-macOS-arm64.zip'   Project_Rio_macOS-Apple_silicon.zip
          one '*ProjectRio-macOS-x86_64.zip'  Project_Rio_macOS-Intel.zip
          one '*.AppImage'                    Project_Rio_Linux.AppImage
          one '*.flatpak'                     Project_Rio_SteamOS.flatpak
          ls -l release
      - name: "Create draft release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" --draft --title "${GITHUB_REF_NAME}" --generate-notes
